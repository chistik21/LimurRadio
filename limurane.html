<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Limurane — локальный музыкальный плеер: загрузка аудиофайлов, плейлисты, избранное, поиск.">
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Limurane</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b10'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23a78bfa' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2334d399'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/player.css?v=7">
</head>
<body>
  <div class="app">

    <!-- Боковая панель -->
    <aside class="sidebar" id="sidebar" aria-label="Навигация">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Limurane</span>
      </div>

      <nav class="side-nav" id="sideNav">
        <button class="side-link" data-nav="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.1 2.6 11h2.8v9.4h5.2v-6.2h2.8v6.2h5.2V11h2.8L12 3.1z"/></svg>
          <span>Главная</span>
        </button>
        <button class="side-link" data-nav="favorites">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.8-9.2C.6 8.4 2.6 4.9 6 4.6c2-.2 3.9.9 6 3.2 2.1-2.3 4-3.4 6-3.2 3.4.3 5.4 3.8 3.8 7.2C19.5 16.4 12 21 12 21z"/></svg>
          <span>Избранное</span>
          <span class="side-count" id="favCount" hidden></span>
        </button>
        <button class="side-link" data-nav="cloud">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 17.8 8.7 4 4 0 0 1 17.5 19h-11zm11.15-2a2 2 0 0 0 .25-3.98l-1.53-.19-.08-1.54A4 4 0 0 0 8.4 10.02l-.4 1.36-1.42.15A2.5 2.5 0 0 0 6.5 17h11.15z"/></svg>
          <span>Облако</span>
          <span class="side-count" id="cloudCount" hidden></span>
        </button>
      </nav>

      <div class="side-section">
        <div class="side-head">
          <span>Плейлисты</span>
          <button class="icon-btn small" id="btnNewPlaylist" title="Создать плейлист" aria-label="Создать плейлист">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
          </button>
        </div>
        <div class="side-playlists" id="sidePlaylists"></div>
      </div>

      <button class="upload-cta" id="btnUploadSide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 6.8 8.2h3.4v6h3.6v-6h3.4L12 3zM4 18h16v2.4H4V18z"/></svg>
        Загрузить музыку
      </button>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- Основная область -->
    <div class="content">
      <nav class="tabs" aria-label="Приложения">
        <a class="tab" href="index.html">📻 Упоротая волна</a>
        <a class="tab active" href="limurane.html" aria-current="page">🎵 Limurane</a>
      </nav>

      <header class="topbar">
        <button class="icon-btn burger" id="btnBurger" aria-label="Меню">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2.2H3V6zm0 5h18v2.2H3V11zm0 5h18v2.2H3V16z"/></svg>
        </button>
        <button class="icon-btn back" id="btnBack" hidden aria-label="Назад">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4 1.7-1.7L11.4 12l5.7-5.7-1.7-1.7z"/></svg>
        </button>
        <div class="search" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l4.8 4.8 1.5-1.5-4.8-4.8A7 7 0 0 0 10 3zm0 2.2A4.8 4.8 0 1 1 10 14.8 4.8 4.8 0 0 1 10 5.2z"/></svg>
          <input type="search" id="searchInput" placeholder="Поиск: треки, альбомы, плейлисты…" autocomplete="off">
          <button class="icon-btn small clear-btn" id="searchClear" hidden aria-label="Очистить поиск">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5z"/></svg>
          </button>
        </div>
        <button class="upload-btn" id="btnUpload">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
          <span>Добавить треки</span>
        </button>
      </header>

      <main class="view" id="view" tabindex="-1"></main>

      <!-- Нижний плеер — в потоке, sticky над адресной строкой -->
      <footer class="player" id="player">
    <div class="player-left">
      <div class="np-cover" id="npCover" aria-hidden="true"></div>
      <div class="np-info">
        <div class="np-title" id="npTitle">Ничего не играет</div>
        <div class="np-artist" id="npArtist">Limurane</div>
      </div>
      <button class="icon-btn fav" id="npFav" aria-label="В избранное" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.8-9.2C.6 8.4 2.6 4.9 6 4.6c2-.2 3.9.9 6 3.2 2.1-2.3 4-3.4 6-3.2 3.4.3 5.4 3.8 3.8 7.2C19.5 16.4 12 21 12 21z"/></svg>
      </button>
    </div>

    <div class="player-center">
      <div class="player-buttons">
        <button class="ghost-btn" id="btnShuffle" aria-label="Перемешать" aria-pressed="false" title="Перемешать">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4h4v4h-2V7.4l-4.3 4.3 4.3 4.3V14.5h2v4h-4v-2h.1l-4.4-4.5L8.3 7H6.5v2h-2V5h2v.5h2.9l4.5 4.5L18 5.5h-1V4zM4 17h2.5l2.2-2.2 1.5 1.5L7.6 19H4v-2z"/></svg>
        </button>
        <button class="icon-btn" id="btnPrev" aria-label="Предыдущий трек">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6V5zm12.6.4v13.2L8.9 12l9.7-6.6z"/></svg>
        </button>
        <button class="play-btn" id="btnPlay" aria-label="Играть" aria-pressed="false">
          <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1v13.8L19 12 8 5.1z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.4v14H7V5zm6.6 0H17v14h-3.4V5z"/></svg>
        </button>
        <button class="icon-btn" id="btnNext" aria-label="Следующий трек">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2V5zM5.4 5.4 15.1 12l-9.7 6.6V5.4z"/></svg>
        </button>
        <button class="ghost-btn" id="btnRepeat" aria-label="Повтор" aria-pressed="false" title="Повтор: выкл">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v2.5L21 6l-4-3.5V5H5v6h2V7zm10 10H7v-2.5L3 18l4 3.5V19h12v-6h-2v4z"/></svg>
          <span class="repeat-badge" hidden>1</span>
        </button>
      </div>
      <div class="seek-row">
        <span class="time" id="timeCur">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Перемотка">
        <span class="time" id="timeTotal">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="icon-btn mute" id="btnMute" aria-label="Выключить звук">
        <svg class="ic-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a3.5 3.5 0 0 0-2-3.2v6.4a3.5 3.5 0 0 0 2-3.2zm-2-8v2.1a6 6 0 0 1 0 11.8V20a8 8 0 0 0 0-16z"/></svg>
        <svg class="ic-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm17 .6L18.6 8 16.5 10 14.4 8 13 9.6l2.1 2.4L13 14.4l1.4 1.6 2.1-2 2.1 2 1.4-1.6-2.1-2.4L20 9.6z"/></svg>
      </button>
      <svg class="vol-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.9" aria-label="Громкость">
    </div>
    </footer>
    </div>
  </div>

  <!-- Скрытые элементы -->
  <input type="file" id="fileInput" accept="audio/*" multiple hidden>
  <div id="menuRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <dialog class="modal" id="playlistModal">
    <form id="playlistForm" method="dialog">
      <h2 id="playlistModalTitle">Новый плейлист</h2>
      <label class="field">
        <span>Название</span>
        <input type="text" id="playlistNameInput" maxlength="60" required autocomplete="off">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="playlistCancel">Отмена</button>
        <button type="submit" class="btn primary" id="playlistSubmit">Создать</button>
      </div>
    </form>
  </dialog>

  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>

  <script src="js/player.js?v=6"></script>
  <script src="js/spotify.js?v=1"></script>
</body>
</html>
